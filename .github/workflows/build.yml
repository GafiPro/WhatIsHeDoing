name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: whatishedoing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-1-21-1-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.21.1-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - run: bash -o pipefail -c 'gradle build --no-daemon --max-workers=2 2>&1 | tee build.log'
      - name: Upload NeoForge build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-1-21-1-neoforge
          path: |
            versions/1.21.1-neoforge/build.log
            versions/1.21.1-neoforge/build/reports/
          if-no-files-found: ignore
      - name: Upload NeoForge jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veillcull-1.21.1-neoforge
          path: versions/1.21.1-neoforge/build/libs/*-1.21.1-NeoForge.jar
