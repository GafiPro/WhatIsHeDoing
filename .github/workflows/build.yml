name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: whatishedoing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-1-21-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.21.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - run: bash -o pipefail -c 'gradle build --no-daemon --max-workers=2 2>&1 | tee build.log'
      - name: Upload 1.21.1 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-1-21-1
          path: |
            versions/1.21.1/build.log
            versions/1.21.1/build/reports/
          if-no-files-found: ignore
      - name: Upload 1.21.1 jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whatishedoing-1.21.1
          path: versions/1.21.1/build/libs/*.jar

  build-1-21-11:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.21.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
