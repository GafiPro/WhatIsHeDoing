name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: whatishedoing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-1-21-11:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/1.21.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - run: gradle build --no-daemon --max-workers=2

  build-26-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/26.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - run: gradle build --no-daemon --max-workers=2
