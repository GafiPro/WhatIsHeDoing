          name: build-log-1-21-11
          path: |
            versions/1.21.11/build.log
            versions/1.21.11/build/reports/
          if-no-files-found: ignore
      - name: Upload 1.21.11 jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whatishedoing-1.21.11
          path: versions/1.21.11/build/libs/*.jar

  build-26-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/26.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
